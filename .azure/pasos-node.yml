# Plantilla de pasos reutilizable (el equivalente a una "composite action" de GitHub):
# instala Node, recupera la caché de npm e instala dependencias.
# Se usa desde azure-pipelines.yml con `- template: .azure/pasos-node.yml`.
parameters:
  - name: nodeVersion
    type: string
    default: '22.x'

steps:
  - task: NodeTool@0
    displayName: Node ${{ parameters.nodeVersion }}
    inputs:
      versionSpec: ${{ parameters.nodeVersion }}

  # La clave cambia cuando cambia package-lock.json: entonces se rehace la caché.
  - task: Cache@2
    displayName: Caché de npm
    inputs:
      key: 'npm | "$(Agent.OS)" | package-lock.json'
      restoreKeys: |
        npm | "$(Agent.OS)"
      path: $(npm_config_cache)

  - script: npm ci
    displayName: npm ci
