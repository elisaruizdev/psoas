<header class="header-private">
    <h1 class="header-private__title" (click)="goToLogin()">Psoas</h1>

    <div class="header-private__user">
        <div class="header-private__avatar">{{initials}}</div>
        <div class="header-private__user-info">
            <span class="header-private__user-name">{{userName}}</span>
            <span class="header-private__user-role">{{userRole}}</span>
        </div>
        <button type="button" class="header-private__logout" aria-label="Cerrar sesión" (click)="logout()">
            <ui-icon name="logout" [size]="24" />
        </button>
    </div>
</header>
