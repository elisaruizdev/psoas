<div class="dialog">
    <header class="dialog__header">
        <h2 class="dialog__title">Detalle del Fisioterapeuta</h2>
        <button type="button" class="dialog__close" aria-label="Cerrar" (click)="onCancel()">
            <ui-icon name="close-lg" [size]="24" />
        </button>
    </header>

    <div class="dialog__body">
        <section class="dialog__section">
            <h3 class="dialog__section-title">Información de Registro (No editable)</h3>
            <div class="dialog__data-grid">
                <div class="dialog__data-item">
                    <span class="dialog__data-label">Nombre Completo</span>
                    <span class="dialog__data-value">{{ physio.name }} {{ physio.surname }} {{ physio.second_surname || '' }}</span>
                </div>
                <div class="dialog__data-item">
                    <span class="dialog__data-label">Correo</span>
                    <span class="dialog__data-value">{{ physio.email }}</span>
                </div>
                <div class="dialog__data-item">
                    <span class="dialog__data-label">Estado</span>
                    <span class="dialog__data-value">{{ getStatusLabel(physio.status) }}</span>
                </div>
                <div class="dialog__data-item">
                    <span class="dialog__data-label">Fecha de Alta</span>
                    <span class="dialog__data-value">{{ formatDate(physio.created_at) }}</span>
                </div>
            </div>
        </section>

        <section class="dialog__section">
            <h3 class="dialog__section-title">Información Editable</h3>
            <f-form [config]="physioFormConfig" [submitButtonText]="'Guardar Cambios'"
                (formSubmit)="onSubmitPhysio($event)" [showCancelButton]="false">
            </f-form>
        </section>
    </div>

    <footer class="dialog__footer">
        <button-ui variant="danger" icon="trash" [title]="'Eliminar Fisioterapeuta'" (click)="onDelete()"></button-ui>
    </footer>
</div>
