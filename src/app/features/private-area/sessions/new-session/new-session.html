<div class="dialog">
    <header class="dialog__header">
        <h2 class="dialog__title">Nueva Cita</h2>
        <button type="button" class="dialog__close" aria-label="Cerrar" [mat-dialog-close]>
            <ui-icon name="close-lg" [size]="24" />
        </button>
    </header>

    <div class="dialog__body">
        @if (appointmentFormConfig()) {
        <f-form [config]="appointmentFormConfig()!" [submitButtonText]="'Crear Cita'"
            (formSubmit)="onSubmitAppointment($event)" (formCancel)="onCancelForm()" [showCancelButton]="true">
        </f-form>
        } @else {
        <p class="dialog__status">Cargando formulario...</p>
        }
    </div>
</div>
