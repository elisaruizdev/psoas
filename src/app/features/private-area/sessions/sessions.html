<div class="sessions">
    <div class="sessions__header">
        <div>
            <p class="sessions__subtitle">Administra las citas y sesiones de tus pacientes</p>
        </div>
        <button-ui [title]="'Nueva sesión'" icon="add" (click)="openNewAppointment()">
        </button-ui>
    </div>

    @if (openError()) {
    <p class="alert alert--error" role="alert">{{ openError() }}</p>
    }

    @if (loadError()) {
    <p class="alert alert--error" role="alert">{{ loadError() }}</p>
    } @else {
    <section class="sessions__table">
        <f-table [config]="listadoAppointmentsConfig()" (rowClick)="onAppointmentClick($event)">
        </f-table>
    </section>
    }
</div>
