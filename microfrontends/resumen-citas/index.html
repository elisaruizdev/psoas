<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Resumen de citas (microfrontend)</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        max-width: 480px;
        margin: 40px auto;
        padding: 0 16px;
      }
      /* La app anfitriona pone el tema con variables CSS: atraviesan el Shadow DOM. */
      psoas-resumen-citas.tema-oscuro {
        --psoas-fondo: #111827;
        --psoas-texto: #f9fafb;
        --psoas-borde: #374151;
        --psoas-primario: #60a5fa;
      }
    </style>
  </head>
  <body>
    <h1>Microfrontend sin Angular</h1>
    <p>El mismo componente que usa el dashboard de Psoas, en una página HTML sin framework.</p>

    <psoas-resumen-citas id="claro" titulo="Citas de hoy"></psoas-resumen-citas>
    <br />
    <psoas-resumen-citas id="oscuro" class="tema-oscuro" titulo="Mismo componente, otro tema"></psoas-resumen-citas>
    <p id="log" aria-live="polite"></p>

    <script type="module">
      import './src/psoas-resumen-citas.ts';

      const citas = [
        { id: 'a-1', hora: '09:30', paciente: 'Lucía García', estado: 'scheduled' },
        { id: 'a-2', hora: '10:00', paciente: 'Ana Ruiz', estado: 'completed' },
        { id: 'a-3', hora: '12:00', paciente: 'Mario Sanz', estado: 'confirmed' },
      ];
      // Datos complejos → propiedad, no atributo.
      for (const el of document.querySelectorAll('psoas-resumen-citas')) el.citas = citas;

      document.addEventListener('cita-seleccionada', (e) => {
        document.getElementById('log').textContent = `Evento recibido: cita ${e.detail.id}`;
      });
    </script>
  </body>
</html>
