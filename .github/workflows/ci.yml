# Pipeline de integración continua de Psoas (frontend).
#
#   calidad ──┐
#   e2e (2 shards) ──> informe-e2e
#   visual            (dentro de la imagen oficial de Playwright)
#   docker            (construye la imagen y la prueba)
#
# Los jobs sin `needs` corren en paralelo.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      actualizar_capturas:
        description: 'Regenerar las capturas visuales de Linux y subirlas como artefacto'
        type: boolean
        default: false

# Si llega un push nuevo a la misma rama, se cancela la ejecución anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22

jobs:
  calidad:
    name: Lint, tests unitarios y build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - name: Tests unitarios (Karma + Jasmine, Chrome headless) con cobertura
        run: npm run test:ci
      - name: Build de producción
        run: npm run build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cobertura
          path: coverage/
          retention-days: 14

  e2e:
    name: E2E (shard ${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Sharding: la suite se reparte entre 2 máquinas que corren a la vez.
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Navegadores de Playwright y sus dependencias de sistema
        run: npx playwright install --with-deps chromium firefox webkit
      # Build de desarrollo: apunta a localhost:3000, que es lo que intercepta la API falsa.
      - run: npx ng build --configuration development
      - name: Playwright (sin @visual, que va en su propio job)
        run: npx playwright test --grep-invert @visual --shard=${{ matrix.shard }}/2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: blob-report-${{ matrix.shard }}
          path: blob-report/
          retention-days: 7
      # El contrato Pact que genera el proyecto `contrato`. En un equipo real se publica
      # en un Pact Broker y el pipeline del backend lo verifica.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: contrato-pact-${{ matrix.shard }}
          path: pacts/
          if-no-files-found: ignore
          retention-days: 14

  informe-e2e:
    name: Informe HTML de E2E
    needs: e2e
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          path: todos-los-blobs
          pattern: blob-report-*
          merge-multiple: true
      - run: npx playwright merge-reports --reporter html ./todos-los-blobs
      - uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  visual:
    name: Tests visuales (Linux)
    runs-on: ubuntu-latest
    # Misma imagen siempre = mismas fuentes y mismo renderizado = capturas comparables.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - run: npx ng build --configuration development
      - name: Comparar contra las capturas de referencia
        if: ${{ !inputs.actualizar_capturas }}
        run: npx playwright test --grep @visual
        env:
          HOME: /root
      - name: Regenerar capturas de referencia
        if: ${{ inputs.actualizar_capturas }}
        run: npx playwright test --grep @visual --update-snapshots
        env:
          HOME: /root
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capturas-visuales
          path: |
            e2e/__screenshots__/
            test-results/
          retention-days: 7

  docker:
    name: Imagen Docker + cabeceras de seguridad
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Construir la imagen
        run: docker build --build-arg API_URL=http://localhost:3000 -t psoas-web .
      - name: Arrancar el contenedor
        run: |
          docker run -d --name psoas-web -p 8080:80 psoas-web
          for i in $(seq 1 30); do curl -sf http://localhost:8080 >/dev/null && break; sleep 1; done
      - name: Tests de la imagen (API + CSP en navegador)
        run: npx playwright test --project=docker
        env:
          WEB_URL: http://localhost:8080
      - name: Logs de nginx si algo falla
        if: failure()
        run: docker logs psoas-web
