server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Los JS y CSS llevan hash en el nombre: se pueden cachear un año
    location ~* \.(js|css|woff2?|ico|png|svg|jpg|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html nunca se cachea, para que cada despliegue se vea al momento
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Rutas de Angular (/patients, /dashboard...): todo cae en index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
